<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
</head>
<body>
    <h1>Product Catalog</h1>
    <table border="1" style="width:100%">
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Availability</th>
                <th>Image</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Laptop</td>
                <td>A high-performance laptop for all your needs.</td>
                <td>Rs.60000</td>
                <td>In Stock</td>
                <td><img src="https://via.placeholder.com/100" alt="Laptop"></td>
            </tr>
            <tr>
                <td>Smartphone</td>
                <td>Latest model with advanced features.</td>
                <td>Rs.55000</td>
                <td>In Stock</td>
                <td><img src="https://via.placeholder.com/100" alt="Smartphone"></td>
            </tr>
            <tr>
                <td colspan="5" align="center">More products coming soon!</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
