<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report</title>
</head>
<body>
    <h1>Central High School</h1>
    <h2>Student Report Card</h2>
    <table border="1" style="width:50%">
        <thead>
            <tr>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Math</td>
                <td>95</td>
            </tr>
            <tr>
                <td>Science</td>
                <td>92</td>
            </tr>
            <tr>
                <td>English</td>
                <td>88</td>
            </tr>
            <tr>
                <td>History</td>
                <td>90</td>
            </tr>
            <tr>
                <td>Art</td>
                <td>94</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td title="Total Marks"><b>Total</b></td>
                <td><b>459</b></td>
            </tr>
            <tr>
                <td rowspan="2"><b>Summary</b></td>
                <td><b>Percentage: 91.8%</b></td>
            </tr>
             <tr>
                <td><b>Grade: A+</b></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
