<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Selector</title>
</head>
<body>
    <h1>Select Your Location and Favorites</h1>
    <label for="country">Country:</label>
    <select id="country">
        <option value="usa">USA</option>
        <option value="india" selected>India</option>
        <option value="uk">UK</option>
    </select>
    <br><br>
    <label for="state">State:</label>
    <select id="state">
        <option value="california">California</option>
        <option value="delhi" selected>Delhi</option>
        <option value="london">London</option>
    </select>
    <br><br>
    <label for="city">City:</label>
    <select id="city">
        <option value="los-angeles">Los Angeles</option>
        <option value="new-delhi" selected>New Delhi</option>
        <option value="london-city">London</option>
    </select>
    <br><br>
    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option value="disneyland">Disneyland</option>
        <option value="india-gate" selected>India Gate</option>
        <option value="tower-of-london">Tower of London</option>
    </select>
    <p>Your selection: You chose to live in New Delhi, Delhi, India, and your favorite tourist spot is India Gate.</p>
</body>
</html>
