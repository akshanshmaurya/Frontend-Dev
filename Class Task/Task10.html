<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mini UI Layout</title>
  <link rel="stylesheet" href="Task10.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Mini UI</h1>
    </div>
  </header>

  <main class="container">
    <section class="main-card">
      <div class="card-inner">
        <div class="card-form">
          <h2>Create account</h2>
          <form class="form">
            <label for="name">Full name</label>
            <input id="name" class="input" type="text" placeholder="Jane Doe">

            <label for="email">Email</label>
            <input id="email" class="input" type="email" placeholder="you@example.com">

            <div class="form-actions">
              <button type="submit" class="btn btn--primary">Sign up</button>
              <button type="button" class="btn btn--outline">Cancel</button>
            </div>
          </form>
        </div>

        <div class="card-media" aria-hidden="true">
          <img src="https://via.placeholder.com/220x140.png?text=Preview" alt="Preview image"/>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© 2025 Mini UI Demo</div>
  </footer>
</body>
</html>
