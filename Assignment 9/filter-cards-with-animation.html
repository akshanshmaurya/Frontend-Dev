<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="filter-cards-with-animation.css">
</head>
<body>
    <header>
        <h1>Filter Cards with Animation</h1>
    </header>

    <main>
        <section class="profile-section" aria-labelledby="profiles-title">
            <h2 id="profiles-title">Meet the Team</h2>
            <div class="profile-grid">
                <article class="profile-card">
                    <img src="https://picsum.photos/id/1005/320/240" alt="Portrait of Alex" loading="lazy">
                    <div class="profile-copy">
                        <h3>Alex Rivera</h3>
                        <p>Creative director who shapes bold visual identities.</p>
                    </div>
                </article>
                <article class="profile-card">
                    <img src="https://picsum.photos/id/1027/320/240" alt="Portrait of Priya" loading="lazy">
                    <div class="profile-copy">
                        <h3>Priya Mehra</h3>
                        <p>UX strategist building inclusive digital journeys.</p>
                    </div>
                </article>
                <article class="profile-card">
                    <img src="https://picsum.photos/id/1011/320/240" alt="Portrait of Mason" loading="lazy">
                    <div class="profile-copy">
                        <h3>Mason Lee</h3>
                        <p>Frontend engineer crafting animated experiences.</p>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>Animated filter cards demo</p>
    </footer>
</body>
</html>
