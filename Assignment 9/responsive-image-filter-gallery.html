<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
    <header>
        <h1>Responsive Image Filter Gallery</h1>
    </header>

    <main>
        <section aria-labelledby="gallery-title">
            <h2 id="gallery-title">Filtered Image Collection</h2>
            <div class="gallery-grid">
                <figure class="filter-item filter-blur">
                    <img src="https://picsum.photos/id/1015/400/300" alt="Mountain landscape">
                    <figcaption>Blur Filter</figcaption>
                </figure>
                <figure class="filter-item filter-grayscale">
                    <img src="https://picsum.photos/id/1025/400/300" alt="Puppy portrait">
                    <figcaption>Grayscale Filter</figcaption>
                </figure>
                <figure class="filter-item filter-sepia">
                    <img src="https://picsum.photos/id/1005/400/300" alt="Forest pathway">
                    <figcaption>Sepia Filter</figcaption>
                </figure>
                <figure class="filter-item filter-brightness">
                    <img src="https://picsum.photos/id/1040/400/300" alt="City skyline at sunset">
                    <figcaption>Brightness Filter</figcaption>
                </figure>
                <figure class="filter-item filter-contrast">
                    <img src="https://picsum.photos/id/1043/400/300" alt="River flowing through rocks">
                    <figcaption>Contrast Filter</figcaption>
                </figure>
                <figure class="filter-item filter-hue">
                    <img src="https://picsum.photos/id/1059/400/300" alt="Beach sunrise">
                    <figcaption>Hue-Rotate Filter</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Responsive Gallery Showcase</p>
    </footer>
</body>
</html>
