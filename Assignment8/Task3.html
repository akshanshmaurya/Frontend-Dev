<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Image Showcase</title>
  <link rel="stylesheet" href="Task3.css">
</head>
<body>
  <header>
    <h1>Image Showcase</h1>
    <p class="lead">Six images arranged using CSS Grid; hover to scale + dark overlay; captions included.</p>
  </header>
  <main>
    <section class="gallery">
      <figure class="card" tabindex="0">
        <img src="https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d?w=1200&q=60" alt="Mountain sunrise">
        <figcaption>Mountain Sunrise</figcaption>
      </figure>
      <figure class="card" tabindex="0">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1200&q=60" alt="Forest path">
        <figcaption>Forest Path</figcaption>
      </figure>
      <figure class="card" tabindex="0">
        <img src="https://images.unsplash.com/photo-1496307042754-b4aa456c4a2d?w=1200&q=60" alt="City skyline">
        <figcaption>City Skyline</figcaption>
      </figure>
      <figure class="card" tabindex="0">
        <img src="https://images.unsplash.com/photo-1504198453319-5ce911bafcde?w=1200&q=60" alt="Desert dunes">
        <figcaption>Desert Dunes</figcaption>
      </figure>
      <figure class="card" tabindex="0">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1200&q=60" alt="Sea horizon">
        <figcaption>Sea Horizon</figcaption>
      </figure>
      <figure class="card" tabindex="0">
        <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1200&q=60" alt="Flower close-up">
        <figcaption>Flower Close-up</figcaption>
      </figure>
    </section>
  </main>
  <footer>
    <p class="center">Responsive grid - stacks to one column below 700px</p>
  </footer>
</body>
</html>
