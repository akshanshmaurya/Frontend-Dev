<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mini UI</title>
  <link rel="stylesheet" href="Task10.css">
</head>
<body>
  <header class="site-header">
    <h1>Mini UI Layout</h1>
  </header>

  <main class="container">
    <section class="card">
      <form class="form">
        <label> Name <input type="text" placeholder="Your name"></label>
        <label> Email <input type="email" placeholder="you@example.com"></label>
        <div class="row">
          <button class="btn primary">Submit</button>
          <button class="btn">Cancel</button>
        </div>
      </form>
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=400&q=60" alt="small" class="thumb">
    </section>
  </main>

  <footer>
    <p class="center">Mini UI with form and image — responsive and uses Flexbox.</p>
  </footer>
</body>
</html>
