<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1: Embed YouTube Video</title>
    <!-- This task is to embed a YouTube video using an iframe with percentage-based width and height. -->
</head>
<body>
    <h1>Embedded YouTube Video</h1>
    <iframe 
        width="100%" 
        height="500" 
        src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
        title="YouTube video player" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
    </iframe>
</body>
</html>
