<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The <title> tag sets the title of the webpage, which appears in the browser tab. -->
    <title>Task 20: Head Elements</title>
    
    <!-- The <meta charset="UTF-8"> tag specifies the character encoding for the document. -->
    <meta charset="UTF-8">
    
    <!-- The <meta name="description"> tag provides a brief summary of the page's content. -->
    <meta name="description" content="This page demonstrates various HTML head elements.">
    
    <!-- The <meta name="author"> tag specifies the author of the document. -->
    <meta name="author" content="Your Name">
    
    <!-- The <base> tag sets the base URL for all relative URLs in the document. -->
    <base href="https://www.example.com/">
    
    <!-- The <link> tag is used to link to external resources, like a favicon. -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <!-- The <style> tag is used for embedding CSS styles. It can be empty. -->
    <style>
        /* CSS styles would go here */
    </style>
    
    <!-- The <script> tag is used for embedding or referencing JavaScript. It can be empty. -->
    <script>
        // JavaScript code would go here
    </script>
</head>
<body>
    <h1>Important Head Elements</h1>
    <p>This page includes a comprehensive set of elements in the &lt;head&gt; section.</p>
</body>
</html>
