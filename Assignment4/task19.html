<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 19: Form Security Attributes</title>
    <!-- This task is to demonstrate form security attributes like autocomplete="off". -->
</head>
<body>
    <h1>Secure Form</h1>
    <form autocomplete="off">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>
        
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>
        
        <input type="submit" value="Login">
    </form>
    
    <p>
        <strong>Note:</strong> Turning off autocomplete (autocomplete="off") can improve security by preventing the browser from storing and suggesting sensitive information like passwords or personal data, reducing the risk of unauthorized access if the device is shared or compromised.
    </p>
</body>
</html>
