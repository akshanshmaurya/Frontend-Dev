<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2: Embed Google Map</title>
    <!-- This task is to embed a Google Map with specific attributes and an explanatory comment. -->
</head>
<body>
    <h1>Embedded Google Map</h1>
    <!-- 
        The loading="lazy" attribute tells the browser to load the iframe only when it is about to become visible 
        in the viewport. This can improve performance by deferring the loading of off-screen content.
    -->
    <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3966.521260322283!2d106.8195613147688!3d-6.194420095514768!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e69f5d2e764b12d%3A0x3d2c58de15594866!2sNational%20Monument!5e0!3m2!1sen!2sid!4v1633961649948!5m2!1sen!2sid" 
        width="600" 
        height="450" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy"
        title="Google Map of a City">
    </iframe>
</body>
</html>
