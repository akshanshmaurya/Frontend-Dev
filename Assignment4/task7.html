<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 7: Login Form</title>
    <!-- This task is to create a login form with a hidden CSRF token. -->
</head>
<body>
    <h1>Login</h1>
    <form>
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>
        
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>
        
        <!-- 
            A CSRF (Cross-Site Request Forgery) token is a unique, secret, unpredictable value that is generated 
            by the server-side application and transmitted to the client in a way that is not easily intercepted 
            by an attacker. When the client submits the form, it must include this token. The server validates 
            the token to ensure the request is legitimate and not from a malicious site.
        -->
        <input type="hidden" name="csrf_token" value="dummy_token_12345">
        
        <input type="submit" value="Login">
    </form>
</body>
</html>
