<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <link rel="stylesheet" href="MovieTicketBooking.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Movie Ticket Booking System</h1>
            <p>Book your movie tickets securely</p>
        </header>

        <main>
            <div class="booking-layout">
                <section class="booking-form-section">
                    <h2>Booking Details</h2>
                    <form id="bookingForm">
                        <div class="form-group">
                            <label for="userName">Full Name:</label>
                            <input type="text" id="userName" placeholder="Your full name" required>
                            <div class="error-message" id="nameError"></div>
                        </div>

                        <div class="form-group">
                            <label for="userEmail">Email Address:</label>
                            <input type="text" id="userEmail" placeholder="your@example.com" required>
                            <div class="error-message" id="emailError"></div>
                        </div>

                        <div class="form-group">
                            <label for="seatCount">Number of Seats (1-10):</label>
                            <input type="number" id="seatCount" min="1" max="10" placeholder="Select seats" required>
                            <div class="error-message" id="seatsError"></div>
                        </div>

                        <div class="form-group">
                            <label for="movieSelect">Select Movie:</label>
                            <select id="movieSelect" required>
                                <option value="">-- Choose a movie --</option>
                                <option value="Dune 2">Dune 2 - ₹300</option>
                                <option value="Avatar 3">Avatar 3 - ₹350</option>
                                <option value="Oppenheimer">Oppenheimer - ₹250</option>
                                <option value="Asteroid City">Asteroid City - ₹280</option>
                            </select>
                        </div>

                        <button type="submit" class="btn-book">Book Tickets</button>
                    </form>
                </section>

                <section class="ticket-display-section">
                    <h2>Ticket Details</h2>
                    <div id="ticketContainer"></div>
                </section>
            </div>
        </main>
    </div>

    <script src="MovieTicketBooking.js"></script>
</body>
</html>
