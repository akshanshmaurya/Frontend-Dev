<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 16: URI Encoding</title>
    <!-- This task is to demonstrate URI encoding in a hyperlink. -->
</head>
<body>
    <h1>URI Encoding Example</h1>
    <p>
        This is an incorrectly encoded link:
        <a href="https://example.com/search?query=HTML & CSS">
            https://example.com/search?query=HTML & CSS
        </a>
    </p>
    <p>
        This is the correctly encoded version:
        <a href="https://example.com/search?query=HTML%20&%20CSS">
            https://example.com/search?query=HTML%20&%20CSS
        </a>
    </p>
</body>
</html>
