<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 8: Feedback Form</title>
    <!-- This task is to create a feedback form. -->
</head>
<body>
    <h1>Feedback Form</h1>
    <form action="#" method="post">
        <label for="feedback">Your Feedback:</label><br>
        <textarea id="feedback" name="feedback" rows="5" cols="30" required></textarea><br><br>
        
        <p>Rating:</p>
        <input type="radio" id="good" name="rating" value="Good">
        <label for="good">Good</label><br>
        <input type="radio" id="average" name="rating" value="Average">
        <label for="average">Average</label><br>
        <input type="radio" id="poor" name="rating" value="Poor">
        <label for="poor">Poor</label><br><br>
        
        <input type="submit" value="Submit Feedback">
    </form>
</body>
</html>
