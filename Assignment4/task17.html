<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 17: Form Submission with Iframe</title>
    <!-- This task is to submit a form and display the result in an iframe. -->
</head>
<body>
    <h1>Form Submission</h1>
    <form action="result.html" target="result_frame">
        <label for="text_input">Enter text:</label>
        <input type="text" id="text_input" name="text_input">
        <input type="submit" value="Submit">
    </form>
    <br>
    <iframe name="result_frame" width="100%" height="100"></iframe>
</body>
</html>
