<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 9: File Upload Form</title>
    <!-- This task is to create a file upload form that accepts only .jpg and .png files. -->
</head>
<body>
    <h1>Upload Your Photo</h1>
    <form>
        <label for="file_upload">Choose a file:</label>
        <input type="file" id="file_upload" name="file_upload" accept=".jpg, .png"><br><br>
        <p>Please upload files in .jpg or .png format only.</p>
        <input type="submit" value="Upload">
    </form>
</body>
</html>
