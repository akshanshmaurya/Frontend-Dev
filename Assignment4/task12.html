<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 12: HTML Entities</title>
    <!-- This task is to demonstrate the use of HTML entities. -->
</head>
<body>
    <h1>HTML Entities</h1>
    <p>
        Less than: &lt; <br>
        Greater than: &gt; <br>
        Ampersand: &amp; <br>
        Double quote: &quot; <br>
        Single quote: &apos; <br>
    </p>
    <p>
        Copyright: &copy; <br>
        Trademark: &trade; <br>
        Registered Trademark: &reg; <br>
    </p>
</body>
</html>
