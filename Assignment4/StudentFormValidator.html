<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form Validator</title>
    <link rel="stylesheet" href="StudentFormValidator.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Student Registration Form</h1>
            <p>Validate your information before registration</p>
        </header>

        <main>
            <form id="studentForm">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                    <div class="error-message" id="nameError"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="text" id="email" placeholder="your@example.com" required>
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="text" id="phone" placeholder="10-digit number" required>
                    <div class="error-message" id="phoneError"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" placeholder="Strong password" required>
                    <div class="error-message" id="passwordError"></div>
                    <div class="password-hints">
                        <p>Password must contain:</p>
                        <ul>
                            <li id="hint-upper">✗ At least 1 uppercase letter (A-Z)</li>
                            <li id="hint-number">✗ At least 1 number (0-9)</li>
                            <li id="hint-special">✗ At least 1 special character (!@#$%^&*)</li>
                        </ul>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Register</button>
            </form>

            <div id="successMessage" class="success-message"></div>
        </main>
    </div>

    <script src="StudentFormValidator.js"></script>
</body>
</html>
