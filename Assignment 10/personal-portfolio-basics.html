<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio — Bootstrap Utilities</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="personal-portfolio-basics.css">
</head>
<body class="bg-light text-dark">
    <header class="py-5">
        <div class="container text-center">
            <!-- mt-4 & text-center utility classes keep spacing simple -->
            <h1 class="fw-bold mb-3">Riya Kapoor</h1>
            <p class="lead mb-0">Product Designer crafting thoughtful, human-centered experiences.</p>
        </div>
    </header>

    <main>
        <section class="container text-center">
            <img src="https://picsum.photos/id/1005/300/300" alt="Portrait of Riya" class="img-fluid rounded-circle shadow-sm mb-4">
            <div class="mb-4 d-flex justify-content-center gap-3">
                <a class="btn btn-primary px-4" href="#contact">Hire Me</a>
                <a class="btn btn-outline-secondary px-4" href="#">Download CV</a>
            </div>
        </section>

        <section id="contact" class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="p-4 bg-white rounded-4 shadow-sm">
                        <h2 class="h4 text-center mb-3">Let’s collaborate</h2>
                        <form>
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name</label>
                                <!-- .form-control provides consistent inputs -->
                                <input type="text" id="name" class="form-control" placeholder="Alex Johnson">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" id="email" class="form-control" placeholder="alex@email.com">
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label">Project Notes</label>
                                <textarea id="message" class="form-control" rows="4" placeholder="Tell me about the challenge"></textarea>
                            </div>
                            <button type="submit" class="btn btn-dark w-100">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center mt-5 py-4">
        <p class="mb-0">© 2025 Riya Kapoor — Portfolio</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
