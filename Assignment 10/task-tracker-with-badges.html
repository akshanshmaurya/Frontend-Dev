<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker with Badges</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="task-tracker-with-badges.css">
</head>
<body>
    <header class="py-5 bg-primary text-white text-center">
        <div class="container">
            <h1 class="h3 d-inline-flex align-items-center gap-3">
                Weekly Tasks
                <!-- Badge counter shows pending tasks -->
                <span class="badge bg-warning text-dark">5 Pending</span>
            </h1>
        </div>
    </header>

    <main class="py-5">
        <section class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="list-group shadow-sm">
                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            Update sprint board
                            <span class="badge bg-danger">High</span>
                        </div>
                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            Prepare usability study
                            <span class="badge bg-warning text-dark">Medium</span>
                        </div>
                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            Publish release notes
                            <span class="badge bg-success">Low</span>
                        </div>
                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            QA payment flow
                            <span class="badge bg-danger">High</span>
                        </div>
                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            Plan retro agenda
                            <span class="badge bg-success">Low</span>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <button class="btn btn-outline-secondary">Add Task</button>
                        <!-- Button with embedded badge for completed count -->
                        <button class="btn btn-success">
                            Completed <span class="badge bg-light text-success ms-2">12</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="py-4 text-center text-muted">
        <p class="mb-0">Keep pushing — every badge moves you closer.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
