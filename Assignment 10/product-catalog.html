<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog — Bootstrap Grid</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="product-catalog.css">
</head>
<body>
    <header class="py-4 bg-dark text-white text-center">
        <div class="container">
            <h1 class="h3 mb-0">Aurora Home — Featured Collection</h1>
        </div>
    </header>

    <main class="py-5">
        <section class="container">
            <div class="row g-4">
                <!-- col-12 col-sm-6 col-md-3 keeps 1/2/4 columns across breakpoints -->
                <div class="col-12 col-sm-6 col-md-3">
                    <article class="card h-100 text-center shadow-sm product-card">
                        <img src="https://picsum.photos/id/1080/400/400" class="card-img-top" alt="Minimal lamp">
                        <div class="card-body">
                            <h2 class="h5">Lumen Lamp</h2>
                            <p class="text-primary fw-bold mb-3">$89</p>
                            <button class="btn btn-outline-dark w-100">Add to Cart</button>
                        </div>
                    </article>
                </div>
                <div class="col-12 col-sm-6 col-md-3">
                    <article class="card h-100 text-center shadow-sm product-card">
                        <img src="https://picsum.photos/id/103/400/400" class="card-img-top" alt="Elegant chair">
                        <div class="card-body">
                            <h2 class="h5">Echo Chair</h2>
                            <p class="text-primary fw-bold mb-3">$129</p>
                            <button class="btn btn-outline-dark w-100">Add to Cart</button>
                        </div>
                    </article>
                </div>
                <div class="col-12 col-sm-6 col-md-3">
                    <article class="card h-100 text-center shadow-sm product-card">
                        <img src="https://picsum.photos/id/1074/400/400" class="card-img-top" alt="Planter">
                        <div class="card-body">
                            <h2 class="h5">Terra Planter</h2>
                            <p class="text-primary fw-bold mb-3">$59</p>
                            <button class="btn btn-outline-dark w-100">Add to Cart</button>
                        </div>
                    </article>
                </div>
                <div class="col-12 col-sm-6 col-md-3">
                    <article class="card h-100 text-center shadow-sm product-card">
                        <img src="https://picsum.photos/id/433/400/400" class="card-img-top" alt="Bedroom set">
                        <div class="card-body">
                            <h2 class="h5">Atlas Nightstand</h2>
                            <p class="text-primary fw-bold mb-3">$149</p>
                            <button class="btn btn-outline-dark w-100">Add to Cart</button>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <footer class="py-4 bg-light text-center">
        <p class="mb-0">Free shipping on orders over $150</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
