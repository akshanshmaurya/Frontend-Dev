<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Webpage Layout</title>
    <link rel="stylesheet" href="task10.css">
</head>
<body>
    <header class="sticky-header">
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="home" class="hero-section">
        <div class="hero-text">
            <h1>Welcome to Our Website</h1>
        </div>
    </section>

    <section id="about">
        <div class="about-content">
            <div class="about-text">
                <h2>About Us</h2>
                <p>Some text about the company...</p>
            </div>
            <div class="about-image">
                <img src="https://via.placeholder.com/300" alt="About us image">
            </div>
        </div>
    </section>

    <section id="services">
        <h2>Our Services</h2>
        <div class="services-container">
            <div class="service-box">Service 1</div>
            <div class="service-box">Service 2</div>
            <div class="service-box">Service 3</div>
        </div>
    </section>

    <section id="contact">
        <h2>Contact Us</h2>
        <form>
            <input type="text" placeholder="Name">
            <input type="email" placeholder="Email">
            <button type="submit">Submit</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Company Name</p>
    </footer>
</body>
</html>
